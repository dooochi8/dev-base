name: harness

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the harness checker
        run: node --test scripts/harness-check.test.mjs scripts/harness-drift.test.mjs
      - name: Prove the template rules can fail
        run: node scripts/harness-check.mjs --config templates/harness/harness.config.json --self-test
