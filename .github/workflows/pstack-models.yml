name: pstack-models

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forbid subagent model defaults
        run: python3 scripts/check-pstack-models
      - name: Test the model check
        run: python3 -B -m unittest scripts.test_pstack_models -v
